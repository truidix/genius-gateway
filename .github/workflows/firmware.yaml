name: firmware
on:
  push:
    branches: ['feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO core (pioarduino fork, matches the pioarduino platform)
        run: pip install https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.2.0.post1.zip
      - name: UI type check (informational, repo has pre-existing errors)
        run: cd interface && npm install --no-package-lock && npm run check || true
      - run: pio run -e gg-v1_0
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-gg-v1_0
          path: .pio/build/gg-v1_0/firmware.bin
